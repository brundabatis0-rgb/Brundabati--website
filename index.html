 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Quiz App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            text-align: center;
            color: #4a5568;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
        }
        .option-btn {
            display: block;
            width: 100%;
            background: #edf2f7;
            border: none;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #cbd5e0;
        }
        .option-btn.correct {
            background: #48bb78 !important;
            color: white;
        }
        .option-btn.wrong {
            background: #f56565 !important;
            color: white;
        }
        #next-btn, #restart-btn {
            display: none;
            width: 100%;
            background: #5a67d8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        #next-btn:hover, #restart-btn:hover {
            background: #434190;
        }
        #score-card {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Tech Quiz</h1>
        
        <div id="quiz-container">
            <div class="question-box" id="question">Sawaal load ho raha hai...</div>
            <div id="options"></div>
            <button id="next-btn" onclick="nextQuestion()">Agle Sawaal par Jayein</button>
        </div>

        <div id="score-card" style="display:none;"></div>
        <button id="restart-btn" onclick="restartQuiz()">Dobara Khelein</button>
    </div>

    <script>
        const questions = [
            {
                q: "HTML ka poora naam kya hai?",
                opts: ["Hyper Text Markup Language", "High Tech Modern Language", "Hyper Transfer Machine Language", "HyperText Markup Link"],
                ans: 0
            },
            {
                q: "Inme se kaunsi programming language nahi hai?",
                opts: ["Python", "HTML", "JavaScript", "C++"],
                ans: 1
            },
            {
                q: "CSS ka use kis liye hota hai?",
                opts: ["Database manage karne ke liye", "Web pages ko style aur design karne ke liye", "Server chalane ke liye", "Code compile karne ke liye"],
                ans: 1
            },
            {
                q: "Python mein comments ke liye kaunsa symbol use hota hai?",
                opts: ["//", "/*", "#", "<!--"],
                ans: 2
            },
            {
                q: "JavaScript ko HTML ke kis element mein rakha jata hai?",
                opts: ["<script>", "<js>", "<javascript>", "<code>"],
                ans: 0
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let locked = false;

        function showQuestion() {
            locked = false;
            document.getElementById("next-btn").style.display = "none";
            let qData = questions[currentIdx];
            document.getElementById("question").innerText = (currentIdx + 1) + ". " + qData.q;
            
            let optHtml = "";
            qData.opts.forEach((opt, i) => {
                optHtml += `<button class="option-btn" onclick="checkAnswer(${i}, this)">${opt}</button>`;
            });
            document.getElementById("options").innerHTML = optHtml;
        }

        function checkAnswer(selected, btn) {
            if (locked) return;
            locked = true;

            let qData = questions[currentIdx];
            let buttons = document.querySelectorAll(".option-btn");

            if (selected === qData.ans) {
                btn.classList.add("correct");
                score++;
            } else {
                btn.classList.add("wrong");
                buttons[qData.ans].classList.add("correct");
            }

            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                document.getElementById("quiz-container").style.display = "none";
                let scoreCard = document.getElementById("score-card");
                scoreCard.style.display = "block";
                scoreCard.innerHTML = `🎉 Quiz Complete!<br>Aapka Score: ${score} / ${questions.length}`;
                document.getElementById("restart-btn").style.display = "block";
            }
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById("quiz-container").style.display = "block";
            document.getElementById("score-card").style.display = "none";
            document.getElementById("restart-btn").style.display = "none";
            showQuestion();
        }

        // Run on load
        showQuestion();
    </script>

</body>
</html>
